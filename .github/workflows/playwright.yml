# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   Runs the full Playwright test suite against the deployed production
#   environment on every push to main. Uploads the HTML report as an artifact
#   so results can be reviewed directly in the GitHub Actions UI.
#
# TRIGGER: push to main
#
# NOTES:
#   - Tests run inside the Docker image defined in ./Dockerfile (Node 20 +
#     Playwright with all browsers), the same image `docker compose` uses locally.
#     Nothing is installed on the runner itself.
#   - Tests run against https://eventhub.rahulshettyacademy.com (live site)
#   - Chromium only (as configured in playwright.config.ts)
#   - HTML report is retained for 30 days as a downloadable artifact
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Playwright Tests
  # ║  Builds the test image, runs all specs in it, and uploads the HTML report.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build the test image ─────────────────────────────────────────────────
      # Layers are cached in the GitHub Actions cache, so the npm and browser
      # install layers are only rebuilt when package-lock.json changes.
      # `load: true` makes the image available to `docker compose` below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Playwright Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: eventhub-playwright:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Run all Playwright tests in the container ────────────────────────────
      # Uses the `tests` service from docker-compose.yml, which mounts
      # playwright-report/ and test-results/ back onto the runner.
      # The container's exit code fails this job when any test fails; the
      # upload step below still runs (if: always()).
      - name: Run Playwright tests
        run: docker compose run --rm tests

      # ── Upload HTML report as artifact ───────────────────────────────────────
      # The report is generated in playwright-report/ by the html reporter.
      # Retained for 30 days so the team can review results after a run.
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
